<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ibiza Kaart — Widget</title>
<!--
  IBIZA KAART — losse widget (geen frameworks).
  Embed:  <iframe src="/ibiza-kaart.html" style="width:100%;height:520px;border:0" loading="lazy"></iframe>
  De kaart is NIET met de vinger te zoomen/pannen — je navigeert door op een club te tikken.
  Standaard staat de kaart uitgezoomd op Ibiza + Formentera; tik een club → inzoomen.
  Clubs/logo's/coördinaten/tekst: de CLUBS-lijst in het script.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

<style>
  html, body { margin: 0; height: 100%; background: #EFEDEA; }
  #ibiza-map-widget { font-family: 'Archivo', sans-serif; background: #EFEDEA; color: #1B1917; padding: 16px; box-sizing: border-box; height: 100%; display: flex; flex-direction: column; }
  #ibiza-map-widget * { box-sizing: border-box; }

  .ibz-coords-row { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .22em; color: #8A857E; padding: 0 2px 12px; }
  .ibz-coords-row .ibz-dot { width: 6px; height: 6px; border-radius: 50%; background: #1B1917; display: inline-block; margin-right: 8px; }

  /* De kaart vult de volledige breedte en de beschikbare hoogte */
  .ibz-frame { position: relative; flex: 1 1 auto; min-height: 0; background: #1B1917; overflow: hidden; border: 1px solid rgba(27,25,23,.15); border-radius: 38px; }
  #ibz-map { position: absolute; inset: 0; }
  .maplibregl-canvas { cursor: default !important; }

  /* HUD */
  .ibz-hud { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .ibz-hud-grid { position: absolute; inset: 0; background-image: repeating-linear-gradient(0deg, rgba(239,237,234,.05) 0 1px, transparent 1px 90px), repeating-linear-gradient(90deg, rgba(239,237,234,.05) 0 1px, transparent 1px 90px); }
  .ibz-corner { position: absolute; width: 22px; height: 22px; }
  .ibz-corner.tl { top: 12px; left: 12px; border-top: 2px solid rgba(239,237,234,.85); border-left: 2px solid rgba(239,237,234,.85); }
  .ibz-corner.tr { top: 12px; right: 12px; border-top: 2px solid rgba(239,237,234,.85); border-right: 2px solid rgba(239,237,234,.85); }
  .ibz-corner.bl { bottom: 12px; left: 12px; border-bottom: 2px solid rgba(239,237,234,.85); border-left: 2px solid rgba(239,237,234,.85); }
  .ibz-corner.br { bottom: 12px; right: 12px; border-bottom: 2px solid rgba(239,237,234,.85); border-right: 2px solid rgba(239,237,234,.85); }
  .ibz-vignette { position: absolute; inset: 0; box-shadow: inset 0 0 90px rgba(27,25,23,.35); }
  .ibz-readout { position: absolute; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 8px; background: rgba(27,25,23,.78); color: #EFEDEA; padding: 6px 11px; font-family: 'Courier New', monospace; font-size: 10px; letter-spacing: .12em; backdrop-filter: blur(6px); box-shadow: 0 10px 26px -12px rgba(0,0,0,.6); }
  .ibz-readout .ibz-pulse { width: 6px; height: 6px; border-radius: 50%; background: #EFEDEA; animation: ibzPulse 1.6s ease-in-out infinite; }
  .ibz-readout.has-club { padding: 7px 14px 7px 7px; gap: 10px; }
  .ibz-rd-badge { width: 28px; height: 28px; flex: 0 0 auto; border-radius: 7px; background: rgba(255,255,255,.14); display: grid; place-items: center; overflow: hidden; }
  .ibz-rd-badge img { max-width: 78%; max-height: 64%; object-fit: contain; filter: brightness(0) invert(1); }
  .ibz-rd-badge .ibz-ini { font-size: 9px; font-weight: 800; color: #EFEDEA; }
  .ibz-rd-name { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 16px; letter-spacing: .01em; }

  /* Info-balk ONDER de kaart */
  .ibz-info { position: relative; overflow: hidden; margin-top: 12px; min-height: 78px; display: flex; align-items: center; gap: 16px; padding: 14px 16px; background: #FBFAF8; border: 1px solid rgba(27,25,23,.15); }
  .ibz-info-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity .5s ease; transform: scale(1.06); }
  .ibz-info.is-club .ibz-info-bg { opacity: 1; }
  .ibz-info.is-club::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(15,14,13,.9) 0%, rgba(15,14,13,.72) 45%, rgba(15,14,13,.4) 100%); }
  .ibz-info-empty { position: relative; z-index: 2; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #8A857E; }
  .ibz-info-badge { position: relative; z-index: 2; width: 58px; height: 58px; flex: 0 0 auto; display: grid; place-items: center; background: rgba(27,25,23,.92); border: 1px solid rgba(255,255,255,.2); border-radius: 12px; overflow: hidden; }
  .ibz-info-badge img { max-width: 76%; max-height: 62%; object-fit: contain; filter: brightness(0) invert(1); }
  .ibz-info-badge .ibz-ini { color: #EFEDEA; font-weight: 800; font-size: 16px; letter-spacing: .04em; }
  .ibz-info-mid { position: relative; z-index: 2; min-width: 0; flex: 1 1 auto; color: #EFEDEA; }
  .ibz-info-name { font-family: 'Instrument Serif', serif; font-style: italic; font-size: clamp(22px, 3vw, 30px); line-height: 1; }
  .ibz-info-area { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; opacity: .82; margin-top: 3px; }
  .ibz-info-text { font-size: 12.5px; line-height: 1.45; opacity: .9; margin-top: 6px; max-width: 60ch; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ibz-info-actions { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 9px; }
  .ibz-info-btn { display: inline-flex; align-items: center; gap: 8px; background: #EFEDEA; color: #1B1917; text-decoration: none; padding: 11px 16px; font-size: 11px; letter-spacing: .14em; font-weight: 800; white-space: nowrap; }
  .ibz-info-back { display: inline-flex; align-items: center; gap: 6px; background: transparent; color: #EFEDEA; border: 1px solid rgba(255,255,255,.55); padding: 11px 14px; font-size: 11px; letter-spacing: .12em; font-weight: 700; cursor: pointer; font-family: 'Archivo', sans-serif; white-space: nowrap; }
  .ibz-info-back:hover { background: rgba(255,255,255,.15); }

  @media (max-width: 640px) {
    .ibz-info { flex-wrap: wrap; }
    .ibz-info-text { display: none; }
    .ibz-info-actions { width: 100%; }
    .ibz-info-btn { flex: 1 1 auto; justify-content: center; }
  }

  /* Chips (club-selectors, horizontaal scrollbaar) */
  .ibz-chips { display: flex; align-items: center; gap: 9px; margin-top: 12px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: thin; }
  .ibz-chip, .ibz-allchip { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; transition: all .25s cubic-bezier(.16,1,.3,1); font-family: 'Archivo', sans-serif; }
  .ibz-allchip { padding: 12px 20px; border: 1px solid #1B1917; background: #1B1917; color: #EFEDEA; font-size: 12px; font-weight: 800; letter-spacing: .16em; }
  .ibz-allchip.is-active { outline: 2px solid #1B1917; outline-offset: 2px; }
  .ibz-chip { padding: 9px 16px 9px 9px; border: 1px solid rgba(27,25,23,.22); background: #FBFAF8; color: #1B1917; font-size: 13px; font-weight: 600; letter-spacing: .04em; }
  .ibz-chip:hover, .ibz-allchip:hover { transform: translateY(-2px); }
  .ibz-chip.is-active { background: #1B1917; color: #EFEDEA; border-color: #1B1917; }
  .ibz-chip-logo { width: 30px; height: 30px; border-radius: 50%; background: #1B1917; display: grid; place-items: center; overflow: hidden; flex: 0 0 auto; }
  .ibz-chip-logo img { max-width: 78%; max-height: 66%; object-fit: contain; filter: brightness(0) invert(1); }
  .ibz-chip-logo .ibz-ini { color: #EFEDEA; font-weight: 800; font-size: 10.5px; }
  .ibz-chip.is-active .ibz-chip-logo { background: #EFEDEA; }
  .ibz-chip.is-active .ibz-chip-logo img { filter: none; }
  .ibz-chip.is-active .ibz-chip-logo .ibz-ini { color: #1B1917; }

  /* Foto-thumbnails (activiteiten hebben een foto i.p.v. wit logo) */
  .ibz-marker img.ibz-photo, .ibz-chip-logo img.ibz-photo, .ibz-rd-badge img.ibz-photo { filter: none; width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover; }
  .ibz-chip.is-active .ibz-chip-logo img.ibz-photo { filter: none; }

  /* Groep-schakelaar: Clubs / Activiteiten */
  .ibz-groups { display: flex; gap: 8px; margin-top: 14px; }
  .ibz-group-btn { flex: 0 0 auto; padding: 10px 18px; border: 1px solid #1B1917; background: transparent; color: #1B1917; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; border-radius: 999px; cursor: pointer; transition: all .2s; }
  .ibz-group-btn:hover { transform: translateY(-1px); }
  .ibz-group-btn.is-active { background: #1B1917; color: #EFEDEA; }

  /* Markers */
  .ibz-marker { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: rgba(27,25,23,.92); border: 1.5px solid rgba(255,255,255,.6); cursor: pointer; box-shadow: 0 10px 26px -8px rgba(0,0,0,.6); transition: transform .25s cubic-bezier(.16,1,.3,1); overflow: hidden; }
  .ibz-marker:hover { transform: scale(1.14); }
  .ibz-marker img { max-width: 74%; max-height: 64%; object-fit: contain; filter: brightness(0) invert(1); }
  .ibz-marker .ibz-ini { color: #EFEDEA; font-weight: 800; font-size: 11px; letter-spacing: .02em; }
  .ibz-marker.is-popping { animation: ibzPop .55s cubic-bezier(.34,1.56,.64,1) both; }

  @keyframes ibzPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.7); } }
  @keyframes ibzPop { from { opacity: 0; transform: scale(0) translateY(14px); } to { opacity: 1; transform: scale(1) translateY(0); } }
</style>

      },
      layers: [{ id: 'satellite', type: 'raster', source: 'satellite' }]
    }
  });

  var LOOKS = { satelliet: 'none', ink: 'grayscale(1) contrast(1.16) brightness(1.06)', nacht: 'grayscale(1) invert(1) contrast(1.12) brightness(.9)', sepia: 'sepia(.5) saturate(.75) contrast(1.06)' };
  map.getCanvas().style.filter = LOOKS[MAP_LOOK] || 'none';

  var selected = false;
  var interactiveOn = false;
  var overviewZoom = 9;
  // Iets ruimere grens om rond Ibiza + Formentera te kunnen pannen, maar niet de zee op.
  var MAX_BOUNDS = [[1.02, 38.52], [1.78, 39.28]];

  map.on('load', function () {
    map.setTerrain({ source: 'dem', exaggeration: 1.15 });
    try { map.setSky({ 'sky-color': '#9EC1DA', 'horizon-color': '#EFEDEA', 'fog-color': '#EFEDEA', 'sky-horizon-blend': 0.5, 'horizon-fog-blend': 0.5, 'fog-ground-blend': 0.85 }); } catch (e) {}
    try { overviewZoom = map.cameraForBounds(HOME_BOUNDS, { padding: PADDING }).zoom; } catch (e) {}
    showAllClubs(true);
  });

  // Trage sfeer-rotatie in overzicht; stopt zodra een club gekozen is of de kaart interactief is.
  (function spin() { if (!selected && !interactiveOn && !map.isEasing()) { try { map.setBearing(map.getBearing() - 0.006); } catch (e) {} } requestAnimationFrame(spin); })();

  // Wordt door de pagina aangestuurd: interactief zodra de kaart is uitgeklapt.
  var HANDLERS = ['dragPan', 'scrollZoom', 'touchZoomRotate', 'doubleClickZoom', 'keyboard'];
  function setInteractive(on) {
    interactiveOn = !!on;
    HANDLERS.forEach(function (h) { if (map[h]) { on ? map[h].enable() : map[h].disable(); } });
    if (on) {
      map.setMaxBounds(MAX_BOUNDS);
      map.setMinZoom(Math.max(0, overviewZoom - 0.15)); // niet verder uitzoomen dan heel Ibiza
      map.setMaxZoom(17);
    } else {
      map.setMinZoom(0);
      map.setMaxBounds(null);
      showAllClubs(); // terug naar het nette overzicht
    }
  }
  window.addEventListener('message', function (e) {
    var d = e && e.data;
    if (d && d.type === 'ibz-interactive') setInteractive(!!d.on);
  });

  /* ================= MARKERS ================= */
  var markers = null;
  function buildMarkers() {
    markers = LIST.map(function (club) {
      var el = document.createElement('button');
      el.type = 'button'; el.className = 'ibz-marker'; el.setAttribute('aria-label', club.name);
      el.innerHTML = badgeInner(club);
      el.addEventListener('click', function (e) { e.stopPropagation(); focusClub(club); });
      return new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat(club.coords);
    });
  }
  function popMarker(m, i) { var el = m.getElement(); el.classList.add('is-popping'); el.style.animationDelay = ((i || 0) * 45) + 'ms'; el.addEventListener('animationend', function () { el.classList.remove('is-popping'); el.style.animationDelay = ''; }, { once: true }); }
  function clearMarkers() { (markers || []).forEach(function (m) { m.remove(); }); }

  /* Kleine balk op de kaart: toont logo + naam van de gekozen club. */
  var readoutEl = document.querySelector('.ibz-readout');
  function updateReadout(club) {
    if (!readoutEl) return;
    if (!club) {
      readoutEl.classList.remove('has-club');
      readoutEl.innerHTML = '<span class="ibz-pulse"></span><span>EIVISSA · ' + LIST.length + ' ' + (currentGroup === 'activities' ? 'ACTIVITEITEN' : 'CLUBS') + '</span>';
      return;
    }
    readoutEl.classList.add('has-club');
    readoutEl.innerHTML = '<span class="ibz-rd-badge">' + badgeInner(club) + '</span><span class="ibz-rd-name">' + club.name + '</span>';
  }
  function renderInfo(club) { updateReadout(club || null); }

  /* ================= ACTIES ================= */
  function focusClub(club) {
    if (!markers) buildMarkers();
    selected = true; clearMarkers();
    var i = LIST.indexOf(club);
    if (markers[i]) { markers[i].addTo(map); popMarker(markers[i], 0); }
    setActiveChip(club.name);
    renderInfo(club);
    map.flyTo({ center: club.coords, zoom: 13.7, pitch: 58, bearing: -14, duration: 2200, essential: true, padding: PADDING });
  }

  function showAllClubs(initial) {
    if (!markers) buildMarkers();
    selected = false; clearMarkers();
    markers.forEach(function (m, i) { m.addTo(map); popMarker(m, i); });
    setActiveChip('ALL'); renderInfo(null);
    map.fitBounds(HOME_BOUNDS, { padding: PADDING, pitch: 38, bearing: -12, duration: initial ? 0 : 1600 });
  }

  /* ================= GROEPEN + CHIPS ================= */
  var groupsWrap = document.getElementById('ibz-groups');
  var chipsWrap = document.getElementById('ibz-chips');
  var allBtn, itemBtns = [];
  var currentGroup = 'clubs';
  var GROUP_LABEL = { clubs: 'CLUBS', activities: 'ACTIVITEITEN' };

  function setActiveChip(name) { if (allBtn) allBtn.classList.toggle('is-active', name === 'ALL'); itemBtns.forEach(function (b) { b.classList.toggle('is-active', b.dataset.item === name); }); }

  function buildChips() {
    chipsWrap.innerHTML = ''; itemBtns = [];
    allBtn = document.createElement('button');
    allBtn.type = 'button'; allBtn.className = 'ibz-allchip'; allBtn.textContent = 'ALLE ' + GROUP_LABEL[currentGroup];
    allBtn.addEventListener('click', function () { showAllClubs(); });
    chipsWrap.appendChild(allBtn);

    LIST.forEach(function (item) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'ibz-chip'; b.dataset.item = item.name;
      b.innerHTML = '<span class="ibz-chip-logo">' + badgeInner(item) + '</span><span>' + item.name + '</span>';
      b.addEventListener('click', function () { focusClub(item); });
      chipsWrap.appendChild(b); itemBtns.push(b);
    });
  }

  function setGroup(g) {
    if (g === currentGroup) return;
    currentGroup = g; LIST = GROUPS[g];
    Array.prototype.forEach.call(groupsWrap.children, function (btn) { btn.classList.toggle('is-active', btn.dataset.group === g); });
    clearMarkers(); markers = null;   // opnieuw opbouwen voor de nieuwe lijst
    chipsWrap.scrollLeft = 0;
    buildChips();
    showAllClubs();
  }

  function buildGroups() {
    ['clubs', 'activities'].forEach(function (g) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'ibz-group-btn' + (g === currentGroup ? ' is-active' : '');
      b.dataset.group = g; b.textContent = GROUP_LABEL[g];
      b.addEventListener('click', function () { setGroup(g); });
      groupsWrap.appendChild(b);
    });
  }

  buildGroups();
  buildChips();
  renderInfo(null);
})();
</script>
</body>
</html>

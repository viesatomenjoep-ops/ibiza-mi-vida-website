<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ibiza 3D Kaart — Widget</title>

<!-- ================================================================
  IBIZA 3D KAART — LOSSE WIDGET
  ----------------------------------------------------------------
  ZO GEBRUIK JE DIT OP JE WEBSITE (2 opties):

  OPTIE A — IFRAME (makkelijkst):
    1. Zet dit bestand op je server, bijv. als /ibiza-kaart.html
    2. Plak op je pagina:
       <iframe src="/ibiza-kaart.html" style="width:100%;height:920px;border:0" loading="lazy"></iframe>

  OPTIE B — DIRECT IN JE PAGINA (in een div):
    1. Kopieer de 4 <link>/<script> regels hieronder naar je <head>
    2. Kopieer het hele <section id="ibiza-map-widget"> blok + de
       <style> + het <script> blok onderaan naar de plek in je pagina
    Alle CSS-klassen hebben een "ibz-" prefix, dus botst nergens mee.

  AANPASSEN:
    - Clubs/coördinaten: de CLUBS lijst bovenin het script
    - Kleurstelling:     MAP_LOOK ('satelliet' | 'ink' | 'nacht' | 'sepia')
    - Hoogte:            .ibz-frame { height: ... }
================================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

<style>
  /* ===== Widget (alles met ibz- prefix, veilig om te embedden) ===== */
  body { margin: 0; background: #EFEDEA; }

  #ibiza-map-widget { font-family: 'Archivo', sans-serif; background: #EFEDEA; color: #1B1917; padding: 24px; box-sizing: border-box; }
  #ibiza-map-widget * { box-sizing: border-box; }

  .ibz-coords-row { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .24em; color: #8A857E; padding: 0 2px 14px; }
  .ibz-coords-row .ibz-dot { width: 6px; height: 6px; border-radius: 50%; background: #1B1917; display: inline-block; margin-right: 8px; }

  .ibz-frame { position: relative; height: min(74vh, 740px); background: #1B1917; overflow: hidden; }
  #ibz-map { position: absolute; top: -278px; left: -50px; right: 0; bottom: 0; }

  /* Digitale HUD-laag */
  .ibz-hud { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  .ibz-hud-grid { position: absolute; inset: 0; background-image: repeating-linear-gradient(0deg, rgba(239,237,234,.055) 0 1px, transparent 1px 90px), repeating-linear-gradient(90deg, rgba(239,237,234,.055) 0 1px, transparent 1px 90px); }
  .ibz-hud-sweep { position: absolute; top: 0; bottom: 0; width: 24%; left: -30%; background: linear-gradient(90deg, transparent, rgba(239,237,234,.08), transparent); animation: ibzSweep 8s linear infinite; }
  .ibz-corner { position: absolute; width: 26px; height: 26px; }
  .ibz-corner.tl { top: 14px; left: 14px; border-top: 2px solid rgba(239,237,234,.9); border-left: 2px solid rgba(239,237,234,.9); }
  .ibz-corner.tr { top: 14px; right: 14px; border-top: 2px solid rgba(239,237,234,.9); border-right: 2px solid rgba(239,237,234,.9); }
  .ibz-corner.bl { bottom: 14px; left: 14px; border-bottom: 2px solid rgba(239,237,234,.9); border-left: 2px solid rgba(239,237,234,.9); }
  .ibz-corner.br { bottom: 14px; right: 14px; border-bottom: 2px solid rgba(239,237,234,.9); border-right: 2px solid rgba(239,237,234,.9); }
  .ibz-vignette { position: absolute; inset: 0; box-shadow: inset 0 0 90px rgba(27,25,23,.35); }
  .ibz-readout { position: absolute; left: 14px; bottom: 52px; display: flex; align-items: center; gap: 8px; background: rgba(27,25,23,.72); color: #EFEDEA; padding: 7px 12px; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: .12em; backdrop-filter: blur(5px); }
  .ibz-readout .ibz-pulse { width: 7px; height: 7px; border-radius: 50%; background: #EFEDEA; animation: ibzPulse 1.6s ease-in-out infinite; }
  .ibz-fade { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(rgba(27,25,23,0), rgba(27,25,23,.28)); pointer-events: none; }

  /* Club-selectors */
  .ibz-chips { display: flex; align-items: center; gap: 10px; margin-top: 16px; overflow-x: auto; padding: 6px 2px 12px; scrollbar-width: thin; }
  .ibz-toggle, .ibz-chip { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; border-radius: 999px; font-family: 'Archivo', sans-serif; cursor: pointer; white-space: nowrap; transition: all .3s cubic-bezier(.16,1,.3,1); }
  .ibz-toggle { padding: 14px 24px; border: 1px solid #1B1917; background: transparent; color: #1B1917; font-size: 12px; font-weight: 700; letter-spacing: .22em; }
  .ibz-toggle .ibz-pulse { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: ibzPulse 2s ease-in-out infinite; }
  .ibz-toggle:hover, .ibz-chip:hover { transform: translateY(-2px); background: #1B1917; color: #EFEDEA; border-color: #1B1917; }
  .ibz-toggle.is-active { background: #1B1917; color: #EFEDEA; }
  .ibz-chip { padding: 13px 22px; border: 1px solid rgba(27,25,23,.25); background: #FBFAF8; color: #1B1917; font-size: 13px; font-weight: 600; letter-spacing: .1em; }
  .ibz-chip.is-active { background: #1B1917; color: #EFEDEA; border-color: #1B1917; }
  .ibz-chips[data-open="false"] .ibz-chip { display: none; }

  /* Markers op de kaart */
  .ibz-marker { display: flex; align-items: center; gap: 9px; padding: 12px 18px; border-radius: 999px; background: rgba(27,25,23,.86); color: #EFEDEA; border: 1px solid rgba(255,255,255,.4); font-family: 'Archivo', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .08em; white-space: nowrap; cursor: pointer; backdrop-filter: blur(5px); box-shadow: 0 10px 26px -8px rgba(0,0,0,.55); transition: transform .25s cubic-bezier(.16,1,.3,1), background .25s, color .25s; }
  .ibz-marker:hover { transform: scale(1.12); background: #EFEDEA; color: #1B1917; }
  .ibz-marker .ibz-pulse { width: 9px; height: 9px; border-radius: 50%; background: currentColor; animation: ibzPulse 2s ease-in-out infinite; flex: 0 0 auto; }
  .ibz-marker.is-popping { animation: ibzPop .55s cubic-bezier(.34,1.56,.64,1) both; }

  /* MapLibre chrome in eigen stijl */
  .maplibregl-ctrl-group { background: rgba(27,25,23,.85) !important; border-radius: 0 !important; box-shadow: 0 10px 26px -8px rgba(0,0,0,.5) !important; backdrop-filter: blur(5px); }
  .maplibregl-ctrl-group button { filter: invert(1); }
  .maplibregl-ctrl-group button + button { border-top: 1px solid rgba(0,0,0,.25) !important; }
  .club-popup .maplibregl-popup-content { background: #EFEDEA; color: #1B1917; border-radius: 0; box-shadow: 0 20px 50px -12px rgba(0,0,0,.5); padding: 16px 18px; }
  .club-popup .maplibregl-popup-tip { border-top-color: #EFEDEA; border-bottom-color: #EFEDEA; }
  .club-popup .maplibregl-popup-close-button { font-size: 18px; color: #8A857E; right: 6px; top: 4px; }

  @keyframes ibzSweep { from { left: -30%; } to { left: 130%; } }
  @keyframes ibzPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.7); } }
  @keyframes ibzPop { from { opacity: 0; transform: scale(0) translateY(14px); } to { opacity: 1; transform: scale(1) translateY(0); } }
</style>
</head>
<body>

<section id="ibiza-map-widget">
  <!-- tekst boven de kaart -->
  <div class="ibz-coords-row">
    <span>38.9800° N — 1.4000° E</span>
    <span><span class="ibz-dot"></span>EIVISSA / BALEARIC ES</span>
  </div>

  <!-- de kaart -->
  <div class="ibz-frame">
    <div id="ibz-map"></div>
    <div class="ibz-hud">
      <div class="ibz-hud-grid"></div>
      <div class="ibz-hud-sweep"></div>
      <div class="ibz-corner tl"></div>
      <div class="ibz-corner tr"></div>
      <div class="ibz-corner bl"></div>
      <div class="ibz-corner br"></div>
      <div class="ibz-vignette"></div>
      <div class="ibz-readout"><span class="ibz-pulse"></span><span id="ibz-coords">38.980° N · 1.400° E</span></div>
    </div>
    <div class="ibz-fade"></div>
  </div>

  <!-- club-selectors (worden door het script gevuld) -->
  <div class="ibz-chips" id="ibz-chips" data-open="false"></div>
</section>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(function () {
  'use strict';

  /* ================= INSTELLINGEN ================= */

  // Kleurstelling van de kaart: 'satelliet' | 'ink' | 'nacht' | 'sepia'
  var MAP_LOOK = 'satelliet';

  // Alle clubs — [lng, lat]. Pas gerust aan of vul aan.
  var CLUBS = [
    { name: 'Pacha',       area: 'Ibiza-Stad · Marina', coords: [1.4429, 38.9181] },
    { name: 'Hï Ibiza',    area: "Playa d'en Bossa",    coords: [1.4046, 38.8862] },
    { name: 'Ushuaïa',     area: "Playa d'en Bossa",    coords: [1.4079, 38.8846] },
    { name: 'Amnesia',     area: 'San Rafael',          coords: [1.4083, 38.9483] },
    { name: 'UNVRS',       area: 'San Rafael',          coords: [1.4095, 38.9520] },
    { name: 'DC-10',       area: 'Ses Salines',         coords: [1.3963, 38.8746] },
    { name: 'Eden',        area: 'San Antonio',         coords: [1.3021, 38.9840] },
    { name: 'Es Paradis',  area: 'San Antonio',         coords: [1.3013, 38.9852] },
    { name: 'Lío',         area: 'Marina Botafoch',     coords: [1.4433, 38.9174] },
    { name: 'Octan',       area: "Playa d'en Bossa",    coords: [1.4020, 38.8930] },
    { name: 'Ibiza Rocks', area: 'San Antonio',         coords: [1.3062, 38.9808] },
    { name: 'Cova Santa',  area: 'San José',            coords: [1.3487, 38.9319] }
  ];

  // Waar de "BEKIJK TICKETS" knop in de popup naartoe linkt (per club aanpasbaar)
  function ticketLink(club) { return '#tickets'; }

  /* ================= KAART ================= */

  var PADDING = { top: 320, bottom: 46, left: 96, right: 46 };

  var map = new maplibregl.Map({
    container: 'ibz-map',
    bounds: [[1.17, 38.78], [1.66, 39.14]],          // volledig eiland in beeld
    fitBoundsOptions: { padding: PADDING },
    maxBounds: [[0.70, 38.40], [2.15, 39.50]],       // navigeren blijft rond het eiland
    maxZoom: 17,
    pitch: 0,
    bearing: 0,
    antialias: true,
    pixelRatio: Math.min((window.devicePixelRatio || 1) < 2 ? 2 : window.devicePixelRatio, 3),
    attributionControl: { compact: true },
    style: {
      version: 8,
      sources: {
        satellite: {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 128,  // haalt tiles 1 zoomniveau dieper op → megascherp
          maxzoom: 19,
          attribution: 'Esri, Maxar, Earthstar Geographics'
        },
        dem: {
          type: 'raster-dem',
          tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
          encoding: 'terrarium',
          tileSize: 256,
          maxzoom: 13
        }
      },
      layers: [{ id: 'satellite', type: 'raster', source: 'satellite' }]
    }
  });

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

  // Kleurstelling (CSS-filter op de canvas)
  var LOOKS = {
    satelliet: 'none',
    ink:       'grayscale(1) contrast(1.18) brightness(1.07)',
    nacht:     'grayscale(1) invert(1) contrast(1.12) brightness(.9)',
    sepia:     'sepia(.5) saturate(.75) contrast(1.06)'
  };
  map.getCanvas().style.filter = LOOKS[MAP_LOOK] || 'none';

  // Live coördinaten-readout
  map.on('mousemove', function (e) {
    var el = document.getElementById('ibz-coords');
    if (el) el.textContent = e.lngLat.lat.toFixed(3) + '° N · ' + e.lngLat.lng.toFixed(3) + '° E';
  });

  map.on('load', function () {
    // Echt 3D-hoogtemodel
    map.setTerrain({ source: 'dem', exaggeration: 1.3 });

    // Sfeervolle lucht/horizon
    try {
      map.setSky({
        'sky-color': '#9EC1DA',
        'horizon-color': '#EFEDEA',
        'fog-color': '#EFEDEA',
        'sky-horizon-blend': 0.6,
        'horizon-fog-blend': 0.6,
        'fog-ground-blend': 0.85,
        'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 12, 0.4]
      });
    } catch (err) { /* oudere maplibre zonder setSky */ }

    // Niet verder kunnen uitzoomen dan het volledige eiland
    map.setMinZoom(map.getZoom() - 0.05);

    // Cinematic fly-in: van recht boven → schuine 3D-hoek
    map.easeTo({ pitch: 58, bearing: -18, duration: 4500, essential: true });
  });

  // Trage auto-rotatie, pauzeert zodra de gebruiker interacteert
  var userBusy = false;
  ['dragstart', 'rotatestart', 'zoomstart', 'pitchstart'].forEach(function (ev) {
    map.on(ev, function () { userBusy = true; });
  });
  (function spin() {
    if (!userBusy && !map.isEasing()) map.setBearing(map.getBearing() - 0.012);
    requestAnimationFrame(spin);
  })();

  /* ================= MARKERS & POPUPS ================= */

  var markers = null;      // lazily gebouwd
  var openPopup = null;

  function buildMarkers() {
    markers = CLUBS.map(function (club) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'ibz-marker';
      el.setAttribute('aria-label', club.name);
      el.innerHTML = '<span class="ibz-pulse"></span><span>' + club.name + '</span>';
      el.addEventListener('click', function (e) { e.stopPropagation(); focusClub(club); });
      return new maplibregl.Marker({ element: el, anchor: 'bottom', offset: [0, -6] }).setLngLat(club.coords);
    });
  }

  function popMarker(m, i) {
    var el = m.getElement();
    el.classList.add('is-popping');
    el.style.animationDelay = ((i || 0) * 70) + 'ms';
    el.addEventListener('animationend', function () {
      el.classList.remove('is-popping');
      el.style.animationDelay = '';
    }, { once: true });
  }

  function clearMarkers() {
    if (openPopup) { openPopup.remove(); openPopup = null; }
    (markers || []).forEach(function (m) { m.remove(); });
  }

  function showPopup(club) {
    openPopup = new maplibregl.Popup({ offset: 52, closeButton: true, className: 'club-popup', anchor: 'bottom', maxWidth: '280px' })
      .setLngLat(club.coords)
      .setHTML(
        '<div style="font-family: Archivo, sans-serif; min-width: 190px;">' +
          '<div style="font-family: \'Instrument Serif\', serif; font-style: italic; font-size: 22px; line-height: 1;">' + club.name + '</div>' +
          '<div style="font-size: 10px; letter-spacing: .22em; color: #8A857E; margin: 7px 0 12px;">' + club.area.toUpperCase() + '</div>' +
          '<a href="' + ticketLink(club) + '" style="display: inline-flex; align-items: center; gap: 8px; background: #1B1917; color: #EFEDEA; text-decoration: none; padding: 10px 16px; font-size: 11px; letter-spacing: .16em;">BEKIJK TICKETS <span>→</span></a>' +
        '</div>'
      )
      .addTo(map);
  }

  // Toon precies ÉÉN club
  function focusClub(club) {
    if (!markers) buildMarkers();
    userBusy = true;
    clearMarkers();
    var i = CLUBS.indexOf(club);
    if (markers[i]) { markers[i].addTo(map); popMarker(markers[i], 0); }
    setActiveChip(club.name);
    map.flyTo({ center: club.coords, zoom: 13.6, pitch: 62, bearing: -18, duration: 2400, essential: true });
    showPopup(club);
  }

  // Toon ALLE clubs
  function showAllClubs() {
    if (!markers) buildMarkers();
    userBusy = true;
    clearMarkers();
    markers.forEach(function (m, i) { m.addTo(map); popMarker(m, i); });
    setActiveChip('ALL');
    map.easeTo({
      center: [1.415, 38.96],
      zoom: map.getMinZoom() + 0.02,
      pitch: 58, bearing: -18, duration: 2200, essential: true,
      padding: PADDING
    });
  }

  /* ================= SELECTORS (chips) ================= */

  var chipsWrap = document.getElementById('ibz-chips');
  var toggleBtn, allBtn, clubBtns = [];

  function setActiveChip(name) {
    allBtn.classList.toggle('is-active', name === 'ALL');
    clubBtns.forEach(function (b) { b.classList.toggle('is-active', b.dataset.club === name); });
  }

  function buildChips() {
    // hoofdknop
    toggleBtn = document.createElement('button');
    toggleBtn.type = 'button';
    toggleBtn.className = 'ibz-toggle';
    toggleBtn.innerHTML = '<span class="ibz-pulse"></span><span>CLUBS OP DE KAART</span><span class="ibz-arrow">→</span>';
    toggleBtn.addEventListener('click', function () {
      var open = chipsWrap.dataset.open === 'true';
      if (open) {              // sluiten: alles van de kaart
        chipsWrap.dataset.open = 'false';
        toggleBtn.classList.remove('is-active');
        toggleBtn.querySelector('.ibz-arrow').textContent = '→';
        clearMarkers();
        setActiveChip(null);
      } else {                 // openen: alleen de selectors tonen
        chipsWrap.dataset.open = 'true';
        toggleBtn.classList.add('is-active');
        toggleBtn.querySelector('.ibz-arrow').textContent = '×';
      }
    });
    chipsWrap.appendChild(toggleBtn);

    // 'alle clubs'-knop
    allBtn = document.createElement('button');
    allBtn.type = 'button';
    allBtn.className = 'ibz-chip';
    allBtn.textContent = 'ALLE CLUBS';
    allBtn.addEventListener('click', showAllClubs);
    chipsWrap.appendChild(allBtn);

    // één knop per club
    CLUBS.forEach(function (club) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'ibz-chip';
      b.dataset.club = club.name;
      b.textContent = club.name;
      b.addEventListener('click', function () { focusClub(club); });
      chipsWrap.appendChild(b);
      clubBtns.push(b);
    });
  }

  buildChips();
})();
</script>
</body>
</html>

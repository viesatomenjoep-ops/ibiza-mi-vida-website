# Dagelijkse agenda-sync + prijsmomentopname.
#
# Twee dingen tegelijk, en het eerste is het belangrijkste:
#
#  1. De ClubTickets-sync draaide tot nu toe alleen als iemand er handmatig aan
#     dacht. Alle prijzen, line-ups en seizoensdata op de site waren dus zo vers
#     als de laatste keer dat dat gebeurde.
#  2. Elke dag vastleggen wat er met de prijzen gebeurt, zodat we over een paar
#     maanden kunnen beantwoorden of vroeg boeken goedkoper is.
#
# GitHub Action en geen Vercel-cron: de sync loopt de hele ClubTickets-API af
# met retries en dat duurt langer dan een serverless functie mag draaien.
#
# De commit onderaan triggert een Vercel-deploy, wat de bedoeling is: verse
# data komt vanzelf live.

name: Prijsmomentopname

on:
  schedule:
    # 05:20 UTC — ruim na de laatste clubavond, voor het ochtendverkeer.
    # Niet op het hele uur: GitHub schuift cronjobs op drukke minuten door.
    - cron: '20 5 * * *'
  workflow_dispatch: {}

# Nodig om de bijgewerkte data terug te committen.
permissions:
  contents: write

concurrency:
  group: price-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Agenda synchroniseren
        run: npm run sync-clubtickets

      - name: Prijzen vastleggen
        run: node scripts/price-snapshot.mjs

      - name: Committen als er iets veranderd is
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data data/price-history
          # Niets veranderd is een geldige uitkomst, geen fout: op een rustige
          # dag verandert er niets en hoort er geen lege commit te ontstaan.
          if git diff --cached --quiet; then
            echo "Geen wijzigingen — niets te committen."
            exit 0
          fi
          git commit -m "Agenda gesynchroniseerd en prijzen vastgelegd ($(date -u +%F))"
          git push

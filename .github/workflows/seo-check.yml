name: SEO checks

# Runs the full SEO suite against a real build on every pull request.
#
# These checks only mean anything against rendered HTML, so the job builds the
# site and serves it rather than linting source. That is deliberate: the failure
# they exist to catch — a page that renders in a browser but is empty to a
# crawler that runs no JavaScript — is invisible to any static analysis.
#
# Concurrency cancels superseded runs on the same PR, so a branch that gets
# three pushes in five minutes does not queue three builds.

# Triggers, and why each one is here:
#
#  - pull_request: block a merge that breaks the markup. The original reason
#    this suite exists.
#  - push to master: commits land on master directly here, both from people and
#    from the nightly data job. Without this trigger the suite never sees the
#    main line at all — it only ever judged branches that happened to go
#    through a PR.
#  - schedule: the pages are built from data that changes underneath them.
#    price-snapshot.yml rewrites the agenda and prices every morning and pushes
#    straight to master, and the dynamic routes read partner APIs at request
#    time. An Offer that loses its price or an AggregateRating that drops to
#    zero reviews is a data failure, not a code failure, so no push has to
#    happen for it to appear. 06:40 UTC is after that job finishes (it starts
#    at 05:20 and waits four minutes on IndexNow) and after live-health at
#    06:00, so the three do not compete for a runner.

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch:

concurrency:
  group: seo-check-${{ github.ref }}-${{ github.event_name }}
  # Only a PR wants its older run cancelled: three pushes in five minutes there
  # should not queue three builds. A scheduled run has no successor to defer
  # to, and cancelling it would mean the nightly data check silently does not
  # happen on the days someone pushes at the wrong moment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The checks compare hreflang and canonicals against this host, and the
      # sitemap is generated from it. It must be the production host even
      # though the server under test is localhost, or every canonical looks
      # wrong to the check.
      NEXT_PUBLIC_SITE_URL: https://www.ibizamivida.com
      CHECK_BASE_URL: http://localhost:3000
      # Keep a PR quick: one URL per template per locale. The nightly run is
      # not waiting on anyone, so it samples wider — a data-driven break shows
      # up on one event page out of forty, and a sample of two would find it
      # only by luck. Set CHECK_ALL=1 manually via workflow_dispatch to sweep
      # the whole sitemap.
      CHECK_SAMPLE: ${{ github.event_name == 'schedule' && '6' || '2' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # npm install and not npm ci, for the reason price-snapshot.yml already
        # documents: this lockfile is generated by npm 11, and npm 10 — what
        # Node 22 ships — resolves a different tree from it and refuses the
        # lockfile outright ("Missing: @swc/helpers@0.5.23 from lock file").
        # npm install is also what Vercel uses to build the site, so the check
        # exercises the same install path production does.
        run: npm install --no-audit --no-fund

      - name: Build
        # The IndexNow postbuild ping is a no-op outside a Vercel production
        # deploy, so it costs nothing here and is left in place rather than
        # skipped, which keeps CI building the same way production does.
        run: npm run build

      - name: Start the server
        run: |
          npx next start -p 3000 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/en; then
              echo "Server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not start within 60s"
          exit 1

      - name: Run SEO checks
        # Any FAIL from the suite exits non-zero and fails the PR. That is the
        # point: the checks are only worth having if they can block a merge.
        run: npm run check:seo

      - name: Stop the server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true
